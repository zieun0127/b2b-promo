<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="sans-serif">
  <!-- 브라우저 뷰포트 -->
  <rect x="0" y="0" width="960" height="640" fill="#f2f2f2" stroke="#999" stroke-width="1"/>

  <!-- 중앙 정렬된 결과 카드 -->
  <rect x="280" y="40" width="400" height="560" rx="6" fill="#ffffff" stroke="#333" stroke-width="2"/>

  <!-- 타이틀 -->
  <text x="480" y="80" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">테스트 결과</text>
  <line x1="310" y1="96" x2="650" y2="96" stroke="#ddd" stroke-width="1"/>

  <!-- MBTI 유형 배지 -->
  <rect x="410" y="120" width="140" height="44" rx="22" fill="none" stroke="#333" stroke-width="2"/>
  <text x="480" y="148" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">ENFP</text>
  <text x="480" y="186" font-size="14" text-anchor="middle" fill="#555">"열정적인 홍보왕" 유형</text>

  <!-- 유형 설명 -->
  <text x="310" y="220" font-size="13" font-weight="bold" fill="#333">유형 설명</text>
  <line x1="310" y1="228" x2="650" y2="228" stroke="#ccc" stroke-width="1"/>
  <rect x="310" y="238" width="340" height="10" fill="#e0e0e0"/>
  <rect x="310" y="256" width="320" height="10" fill="#e0e0e0"/>
  <rect x="310" y="274" width="280" height="10" fill="#e0e0e0"/>

  <!-- 장사 TIP -->
  <text x="310" y="314" font-size="13" font-weight="bold" fill="#333">장사 TIP</text>
  <line x1="310" y1="322" x2="650" y2="322" stroke="#ccc" stroke-width="1"/>
  <text x="318" y="342" font-size="12" fill="#555">• SNS 이벤트를 적극 활용</text>
  <text x="318" y="362" font-size="12" fill="#555">• 신메뉴 출시 주기를 짧게 유지</text>

  <!-- 추천 프로모션 -->
  <text x="310" y="402" font-size="13" font-weight="bold" fill="#333">추천 프로모션</text>
  <line x1="310" y1="410" x2="650" y2="410" stroke="#ccc" stroke-width="1"/>
  <rect x="310" y="422" width="340" height="36" rx="4" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="480" y="445" font-size="12" text-anchor="middle" fill="#444">SNS 인증샷 할인 쿠폰</text>

  <!-- 버튼 -->
  <rect x="380" y="500" width="200" height="44" rx="4" fill="#333"/>
  <text x="480" y="527" font-size="14" text-anchor="middle" fill="#fff">마이페이지로 이동</text>

  <!-- 하단 안내 -->
  <text x="480" y="580" font-size="11" text-anchor="middle" fill="#999">사장님 MBTI · ResultPage (데스크탑, 카드 중앙 정렬)</text>
</svg>
